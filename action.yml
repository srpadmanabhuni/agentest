# AiEnsured agentest, an Agentic AI Testing platform, as a GitHub Action.
# It checks what the agent actually did (from recorded traces), not only what it said.
# Runs offline: no model calls, no API keys, no secrets.
#
# Usage (pin to a commit SHA or tag of this repository):
#   - uses: actions/checkout@v4
#   - uses: srpadmanabhuni/agentest@<sha-or-tag>
#     with:
#       otlp: traces/*.otlp.jsonl
#
# Install note: by default this action installs agentest from the same ref of this
# repository that you pinned in `uses:`. The CLI package on PyPI is agentest-ai.
# Docs: docs/developers/GITHUB-ACTION.md
name: "AiEnsured agentest"
description: "Agentic AI Testing platform: check what your agent actually did from OpenTelemetry traces. Offline, no API keys."
author: "Dr Srinivas Padmanabhuni"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  otlp:
    description: "OTLP trace files or glob patterns (OTLP/JSON .json/.jsonl, OTLP/protobuf .pb), separated by spaces or new lines. Leave empty to judge agent folders instead (see `agents`)."
    required: false
    default: ""
  card:
    description: "With `otlp`: optional A2A AgentCard JSON file."
    required: false
    default: ""
  tools:
    description: "With `otlp`: optional MCP tools/list JSON file."
    required: false
    default: ""
  agents:
    description: "Without `otlp`: directory of agent folders (each with agent-card.json, tools.json and traces/), relative to the working directory."
    required: false
    default: "agents"
  agent:
    description: "Without `otlp`: limit the run to one agent folder id."
    required: false
    default: ""
  ids:
    description: "Limit the report to test IDs or classes, comma-separated (for example T5,T6-002)."
    required: false
    default: ""
  mode:
    description: "Check mode: `strict` (only standard OTel/A2A/MCP fields) or `examples`. Empty uses the CLI default."
    required: false
    default: ""
  config:
    description: "Optional YAML/JSON config file (disable IDs, thresholds, rules_dir, scenarios)."
    required: false
    default: ""
  format:
    description: "Report format: md, json, junit, sarif, html or csv."
    required: false
    default: "md"
  report:
    description: "Report file path. Empty writes agentest-report.<format extension> in the workspace."
    required: false
    default: ""
  fail-on-fail:
    description: "Fail the step when any check returns a fail verdict (`agentest std run --strict`). Set to `false` to report only."
    required: false
    default: "true"
  job-summary:
    description: "Append the run totals (and the report, for format md) to the job summary."
    required: false
    default: "true"
  pr-comment:
    description: "Off by default. `true` posts, or updates in place, ONE comment on the pull request listing the failed check IDs with a line of evidence each; it needs `pull-requests: write` on the job. `summary` only writes the same text to the job summary and needs no token. Pull requests from another repository (read-only token), runs that are not for a pull request, and API errors fall back to the job summary and never fail the step."
    required: false
    default: "false"
  github-token:
    description: "Token used only when `pr-comment` is `true`, and only to call the GitHub API of this repository. The workflow's own token is enough; grant the job `pull-requests: write`."
    required: false
    default: "${{ github.token }}"
  comment-key:
    description: "With `pr-comment: true`: names the comment (default `agentest`). Runs that use the same key on one pull request update one comment; use different keys to keep separate comments, for example per agent."
    required: false
    default: "agentest"
  pr-number:
    description: "With `pr-comment: true`: pull request number. Empty reads it from the event, which is right for `pull_request` workflows."
    required: false
    default: ""
  github-api-url:
    description: "With `pr-comment: true`: the GitHub REST API base URL (for GitHub Enterprise Server)."
    required: false
    default: "${{ github.api_url }}"
  python-version:
    description: "Python version to set up (3.11 or later). Set to an empty string to use the Python already on the runner."
    required: false
    default: "3.12"
  install:
    description: "What to pip install. Empty (default) installs agentest from this action's own ref of the repository. Otherwise any pip requirement, for example `agentest-ai @ git+https://github.com/srpadmanabhuni/agentest@<sha>`."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Exit code of `agentest std run` (0 = no fail verdicts, 1 = at least one fail, other = error)."
    value: ${{ steps.run.outputs.exit-code }}
  passed:
    description: "Number of pass verdicts."
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: "Number of fail verdicts."
    value: ${{ steps.run.outputs.failed }}
  not-applicable:
    description: "Number of n/a verdicts."
    value: ${{ steps.run.outputs.not-applicable }}
  report:
    description: "Path of the report file."
    value: ${{ steps.run.outputs.report }}
  comment-status:
    description: "With `pr-comment`: `created`, `updated`, `unchanged`, `none` (nothing to report), `summary`, `read-only`, `no-pr`, `no-token` or `error`; `off` otherwise."
    value: ${{ steps.comment.outputs.status || 'off' }}
  comment-url:
    description: "URL of the pull request comment when one was created or updated."
    value: ${{ steps.comment.outputs.url }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agentest
      shell: bash
      env:
        AGENTEST_INSTALL: ${{ inputs.install }}
        AGENTEST_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$AGENTEST_INSTALL" ]; then
          python -m pip install --disable-pip-version-check -q "$AGENTEST_INSTALL"
        else
          python -m pip install --disable-pip-version-check -q "$AGENTEST_ACTION_PATH"
        fi
        agentest version

    - name: Run agentest
      id: run
      shell: bash
      env:
        AGENTEST_OTLP: ${{ inputs.otlp }}
        AGENTEST_CARD: ${{ inputs.card }}
        AGENTEST_TOOLS: ${{ inputs.tools }}
        AGENTEST_AGENTS: ${{ inputs.agents }}
        AGENTEST_AGENT: ${{ inputs.agent }}
        AGENTEST_IDS: ${{ inputs.ids }}
        AGENTEST_MODE: ${{ inputs.mode }}
        AGENTEST_CONFIG: ${{ inputs.config }}
        AGENTEST_FORMAT: ${{ inputs.format }}
        AGENTEST_REPORT: ${{ inputs.report }}
        AGENTEST_FAIL_ON_FAIL: ${{ inputs.fail-on-fail }}
        AGENTEST_JOB_SUMMARY: ${{ inputs.job-summary }}
        AGENTEST_PR_COMMENT: ${{ inputs.pr-comment }}
      run: bash "${{ github.action_path }}/scripts/gh_action_run.sh"

    # Optional and off by default. The token is in this step's environment only when `pr-comment` is `true`.
    - name: Post or update the PR comment
      id: comment
      if: ${{ always() && inputs.pr-comment != 'false' }}
      shell: bash
      env:
        AGENTEST_PR_COMMENT: ${{ inputs.pr-comment }}
        AGENTEST_COMMENT_DIR: ${{ steps.run.outputs.comment-dir }}
        AGENTEST_COMMENT_KEY: ${{ inputs.comment-key }}
        AGENTEST_PR_NUMBER: ${{ inputs.pr-number }}
        AGENTEST_GITHUB_API_URL: ${{ inputs.github-api-url }}
        AGENTEST_GITHUB_TOKEN: ${{ inputs.pr-comment == 'true' && inputs.github-token || '' }}
      run: |
        PY="$(command -v python3 || command -v python)"
        "$PY" "${{ github.action_path }}/scripts/gh_action_comment.py"
