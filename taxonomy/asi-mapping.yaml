# agentest check -> OWASP Top 10 for Agentic Applications (ASI01-ASI10) mapping, taxonomy v0.1.
# Source of truth for docs/taxonomy/ASI-MAPPING.md and docs/taxonomy/TAXONOMY.md (generated by scripts/gen_taxonomy_docs.py).
# tests/test_asi_mapping.py fails when a registered check is missing here. A check that does not fit an ASI entry says
# 'no ASI mapping' with a reason; it is never forced into one.
schema: agentest/asi-mapping/1
taxonomy_version: '0.1'
source:
  name: OWASP Top 10 for Agentic Applications for 2026 (OWASP GenAI Security Project, Agentic Security Initiative), version 2026, December 2025
  url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
  document_url: https://genai.owasp.org/download/52117/
  fetched: '2026-11-26'
  licence: CC BY-SA 4.0
  notice: ASI IDs and titles are quoted from the OWASP document. The assignment of agentest checks to them is this project's own judgement. OWASP
    has not reviewed or endorsed it.
fit_values:
  direct: A failing run is an instance of what the ASI entry describes (its description or one of its common examples).
  partial: The check guards a control or precondition the ASI entry names, or covers part of it, without being an instance of the entry itself.
nist_ai_rmf_note: Function tags (GOVERN, MAP, MEASURE, MANAGE) are indicative and assigned per failure category; absent where no function is clear.
  Not a compliance claim.
asi:
  ASI01: Agent Goal Hijack
  ASI02: Tool Misuse and Exploitation
  ASI03: Identity and Privilege Abuse
  ASI04: Agentic Supply Chain Vulnerabilities
  ASI05: Unexpected Code Execution (RCE)
  ASI06: Memory & Context Poisoning
  ASI07: Insecure Inter-Agent Communication
  ASI08: Cascading Failures
  ASI09: Human-Agent Trust Exploitation
  ASI10: Rogue Agents
categories:
  AFC-01:
    slug: task-outcome-integrity
    title: Task outcome and side-effect integrity
    definition: 'The recorded end state, side effects and artefacts match what was asked: no false completion, no stray or duplicated writes,
      no half-applied changes.'
  AFC-02:
    slug: ordering-and-dependencies
    title: Ordering and dependencies
    definition: 'Steps run in a valid order: prerequisites succeed before the steps that depend on them, and irreversible steps wait for them.'
  AFC-03:
    slug: authority-approval-oversight
    title: Authority, approval and human oversight
    definition: 'Actions carry the authority they need: approvals are real, scoped and single-use, roles hold after a handover, and a human is
      brought in where the design says so.'
  AFC-04:
    slug: hijack-by-untrusted-content
    title: Instruction hijack from untrusted content
    definition: Text the agent reads (documents, tool results, messages, images) or is given in a jailbreak attempt changes what it does.
  AFC-05:
    slug: tool-boundaries
    title: Tool-use boundaries and least agency
    definition: The agent uses only the tools, arguments, destinations and rates it is allowed to, and the limits are enforced outside the prompt.
  AFC-06:
    slug: state-and-memory
    title: State, memory and data-flow integrity
    definition: What the agent remembers across turns and tools stays correct, is not overwritten by the wrong party, and does not flow to places
      it should not.
  AFC-07:
    slug: consistency-and-robustness
    title: Consistency and robustness
    definition: The same task gives the same decision and actions under paraphrase, translation, repetition or a fresh start.
  AFC-08:
    slug: privacy-and-sensitive-data
    title: Privacy and sensitive-data protection
    definition: Personal and secret data is disclosed, logged, retained and erased only as consent and policy allow.
  AFC-09:
    slug: honest-reporting-and-traceability
    title: Honest reporting, explanation and traceability
    definition: What the agent says it did matches the trace, failures are disclosed, and decisions can be reconstructed from the record.
  AFC-10:
    slug: fairness
    title: Fairness across groups
    definition: Decisions, refusals and answer quality do not depend on protected attributes or task-irrelevant personas.
  AFC-11:
    slug: multi-agent-coordination
    title: Multi-agent coordination
    definition: Agents delegate along the declared graph, hand over context intact, and do not loop, conflict or hide each other's failures.
  AFC-12:
    slug: resource-and-runaway-behaviour
    title: Resource budgets and runaway behaviour
    definition: Steps, calls, retries, time and cost stay inside declared budgets.
