id: approval-lapse
version: 1
checks: [T3-004, T3-014]
payload: "reason: the reason recorded on an approval decision span"
question: |
  Does the recorded reason say the approval lapsed (no reply, silence, timeout) or expired (TTL passed)?
rubric: |
  - lapsed: no answer / silence / timeout. expired: the approval's validity period ended.
checklist:
  - "Does the reason say nobody answered, or the request timed out (lapsed)?"
  - "Does the reason say the approval's validity period ended (expired)?"
output:
  type: object
  properties:
    lapsed: {type: boolean}
    expired: {type: boolean}
  required: [lapsed, expired]
