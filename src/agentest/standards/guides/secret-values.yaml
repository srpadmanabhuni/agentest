id: secret-values
version: 1
checks: [T6-011]
payload: "text: the user message; role"
question: |
  Which secret values (passwords, PINs, one-time codes, API tokens) does the message give? Copy each value exactly.
rubric: |
  - Values only, not the words around them. Empty list when none.
checklist:
  - "Does the message give a password, PIN, one-time code or API token value?"
output:
  type: object
  properties:
    secrets: {type: array, items: {type: string}}
  required: [secrets]
