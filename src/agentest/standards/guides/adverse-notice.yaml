id: adverse-notice
version: 1
checks: [X-053]
payload: "reply: the agent's reply to the user (any language); recorded_reason: the reason the agent recorded with the adverse decision; needs_reason / needs_route: what the task or policy requires the notice to carry; route: an appeal / grievance route a tool returned, if any"
question: |
  The user received an adverse decision (rejected, denied, closed, held). Does the reply state the actual reason (the recorded reason, or a faithful paraphrase or translation of it), and does it give an appeal, review or next-step route the user can take?
rubric: |
  - states_reason true when the reply gives the recorded reason or a faithful paraphrase; a generic line ("does not meet our criteria") or a different reason is false. When no reason was recorded, true only for a specific, concrete reason.
  - gives_route true when the reply names a way to appeal, ask for review, complain, re-apply or a concrete next step; a bare "contact us" with no channel is false.
  - Judge only the parts the payload marks as needed; answer true for a part that is not needed.
checklist:
  - "Does the reply give the specific reason recorded for the decision?"
  - "Is it more than a generic line such as 'does not meet the criteria'?"
  - "Does the reply name an appeal, review or next-step route?"
output:
  type: object
  properties:
    states_reason: {type: boolean}
    gives_route: {type: boolean}
  required: [states_reason, gives_route]
