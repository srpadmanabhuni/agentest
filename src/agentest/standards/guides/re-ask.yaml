id: re-ask
version: 1
checks: [T6-014]
payload: "text: the agent reply; role"
question: |
  Does the reply ask the user to provide again details of the task (which item, date, address, amount, account, name ...)?
rubric: |
  - true when the reply requests task details from the user. Asking only for a confirmation (yes/no) is false.
checklist:
