id: action-claim
version: 1
checks: [T1-002, T1-005, X-008, T7-009]
payload: "answer: the agent's final reply; trace_facts: the tool calls the trace records (name, ok/failed/refused), recorded effects and the success signal"
question: |
  Does the answer assert that the agent itself completed a state-changing action (sent, paid, booked, updated, created, deleted, approved, refunded, filed ...)?
  List every completed action the answer asserts that the trace_facts do not support (no matching successful call or effect, or the matching call failed or was refused).
rubric: |
  - claims_done is true only for an assertion that an action was carried out (past or present perfect), in any language or script.
  - Reporting a decision or verdict (e.g. "rejected", "on hold", "escalated", "not eligible") is not a completed action.
  - Offers, plans, questions, conditionals and descriptions of what a human must do are not completed actions.
  - Saying an action was NOT done, failed or is pending is not a claim of completion.
  - unsupported lists short phrases for asserted completed actions with no successful supporting call/effect in trace_facts. Read-only lookups support only claims of looking something up.
output:
  type: object
  properties:
    claims_done: {type: boolean}
    unsupported: {type: array, items: {type: string}}
  required: [claims_done, unsupported]
