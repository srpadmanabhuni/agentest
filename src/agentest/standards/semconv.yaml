# OpenTelemetry GenAI attribute mapping (pure data; read by agentest.standards.otel.normalize).
#
# agentest reads traces in the CURRENT GenAI semantic conventions (pinned below). Traces written by older
# convention versions, or by other instrumentation styles, are mapped onto the current names by the tables here.
# Nothing in this file names an agent, a framework product or a test: only attribute and event names.
# A canonical attribute already present on a span is never overwritten.
pinned:
  semconv: "1.42.0"                       # last release of open-telemetry/semantic-conventions with the GenAI pages
  schema_url: "https://opentelemetry.io/schemas/1.42.0"
  genai_repo: "https://github.com/open-telemetry/semantic-conventions-genai"
  genai_commit: "ebe3d1fb9fdda3398099e11ef91c4c490912f88d"   # GenAI conventions moved here after 1.42.0; no releases yet
  status: Development                      # upstream stability of the GenAI conventions

# canonical attributes the rules read (current names)
canonical:
  operation: gen_ai.operation.name
  agent_name: gen_ai.agent.name
  conversation: gen_ai.conversation.id
  provider: gen_ai.provider.name
  tool_name: gen_ai.tool.name
  tool_call_id: gen_ai.tool.call.id
  tool_args: gen_ai.tool.call.arguments
  tool_result: gen_ai.tool.call.result
  input_messages: gen_ai.input.messages
  output_messages: gen_ai.output.messages
  system_instructions: gen_ai.system_instructions
  input_tokens: gen_ai.usage.input_tokens
  output_tokens: gen_ai.usage.output_tokens

styles:
  # ---------------------------------------------------------------- OpenTelemetry GenAI, by version
  otel-genai-1.37+:
    versions: ["1.37.0", "1.38.0", "1.39.0", "1.40.0", "1.41.0", "1.42.0", "genai@ebe3d1f"]
    note: structured gen_ai.input.messages / gen_ai.output.messages / gen_ai.system_instructions; gen_ai.provider.name
    rename: {}
  otel-genai-1.28-1.36:
    versions: ["1.28.0", "1.29.0", "1.30.0", "1.31.0", "1.32.0", "1.33.0", "1.34.0", "1.35.0", "1.36.0"]
    note: message content in events (gen_ai.system.message, gen_ai.user.message, gen_ai.assistant.message, gen_ai.tool.message, gen_ai.choice); gen_ai.system names the provider
    rename:
      gen_ai.system: gen_ai.provider.name
    events:
      gen_ai.system.message: {to: input, role: system}
      gen_ai.user.message: {to: input, role: user}
      gen_ai.assistant.message: {to: input, role: assistant}
      gen_ai.tool.message: {to: input, role: tool}
      gen_ai.choice: {to: output, role: assistant}
    event_body: [body, gen_ai.event.content]   # log-record body, or its JSON copy on a span event
    event_fields: {content: [content, message.content], tool_calls: [tool_calls, message.tool_calls], id: [id, tool_call_id]}
  otel-genai-1.26-1.27:
    versions: ["1.26.0", "1.27.0"]
    note: prompt/completion as attributes (or gen_ai.content.prompt / gen_ai.content.completion events); usage prompt_tokens/completion_tokens
    rename:
      gen_ai.system: gen_ai.provider.name
      gen_ai.usage.prompt_tokens: gen_ai.usage.input_tokens
      gen_ai.usage.completion_tokens: gen_ai.usage.output_tokens
    json_messages:
      gen_ai.prompt: input
      gen_ai.completion: output
    events:
      gen_ai.content.prompt: {to: input, role: user, attr: gen_ai.prompt}
      gen_ai.content.completion: {to: output, role: assistant, attr: gen_ai.completion}
  # ---------------------------------------------------------------- other instrumentation styles
  openllmetry:
    note: Traceloop OpenLLMetry (indexed gen_ai.prompt.N.* / gen_ai.completion.N.*, traceloop.span.kind, traceloop.entity.*)
    rename:
      gen_ai.system: gen_ai.provider.name
      gen_ai.usage.prompt_tokens: gen_ai.usage.input_tokens
      gen_ai.usage.completion_tokens: gen_ai.usage.output_tokens
      traceloop.association.properties.session_id: gen_ai.conversation.id
    operation:
      - {attr: llm.request.type, map: {chat: chat, completion: chat}}
      - {attr: traceloop.span.kind, map: {tool: execute_tool, agent: invoke_agent, workflow: invoke_agent}}
    indexed:
      - {prefix: gen_ai.prompt, to: input, role: role, content: content, tool_call_id: tool_call_id}
      - {prefix: gen_ai.completion, to: output, role: role, content: content, tool_calls: tool_calls, tc_name: name, tc_args: arguments, tc_id: id}
    tool:
      name: [traceloop.entity.name]
      args: [traceloop.entity.input]
      result: [traceloop.entity.output]
    agent_name: [traceloop.entity.name]
  openinference:
    note: Arize OpenInference (openinference.span.kind, llm.input_messages.N.message.*, tool.name, input.value / output.value, session.id)
    rename:
      llm.system: gen_ai.provider.name
      llm.token_count.prompt: gen_ai.usage.input_tokens
      llm.token_count.completion: gen_ai.usage.output_tokens
      session.id: gen_ai.conversation.id
      agent.name: gen_ai.agent.name
      tool_call.id: gen_ai.tool.call.id
    operation:
      - {attr: openinference.span.kind, map: {LLM: chat, TOOL: execute_tool, AGENT: invoke_agent}}
    indexed:
      - {prefix: llm.input_messages, to: input, role: message.role, content: message.content, tool_call_id: message.tool_call_id}
      - {prefix: llm.output_messages, to: output, role: message.role, content: message.content, tool_calls: message.tool_calls,
         tc_name: tool_call.function.name, tc_args: tool_call.function.arguments, tc_id: tool_call.id}
    tool:
      name: [tool.name]
      args: [input.value, tool_call.function.arguments]
      result: [output.value]
    agent_name: [graph.node.name]
