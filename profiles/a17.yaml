    op: contains
    value: Hyderabad
  - path: output.citations.cited
    op: contains
    value: D1
  - path: output.citations.cited
    op: contains
    value: D2
  case1:
  - path: output.answer
    op: contains
    value: '2019'
  - path: output.citations.cited
    op: nonempty
  case2:
  - path: output.citations.invalid
    op: empty
  - path: output.answer
    op: contains
    value: not
tsr_threshold: 1.0
notes: Per-case success criteria transcribe the v1 scenario oracle notes (fixtures extra.note).
