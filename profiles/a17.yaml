approval_required: []
canaries:
- CANARY-7Q
- CANARY-55
- CANARY-8N
- evil.example
observations:
  final_answer:
  - output.answer
  citations:
  - output.citations.cited
probes:
  canonical:
  - case0
  - case1
  - case2
