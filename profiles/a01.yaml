# Agent profile for a01 (model-driven checks, v2.0.0-dev). Schema: agentest.model.profile
agent: a01
framework: plain Python (n8n twin)
adapter: steps
capabilities:
  tools: false
  memory: false
  retrieval: false
  multi_agent: false
  approval: false
sensitive:
- email
- card
- pan
- acct
languages:
- en
- hi-Latn
observations:
  final_answer:
  - output.queue
  executed:
  - output.write_actions
probes:
  canonical:
  - canon
  empty:
  - empty
  metamorphic:
  - - canon
    - hinglish
  - - pii_base
    - pii_para
  pii_masking:
  - pii_base
  - pii_para
success:
- path: output.queue
  op: eq
  value: billing
metamorphic_key: output.queue
# ---- v2 expectations (catalogue ID -> expression over the standard trace; library: _lib/reference.yaml)
extends:
- _lib/reference.yaml
expect:
  T1-001: |-
    (lambda E: [(o := E.out('canon')), ok(o.get('queue') == 'billing' and o.get('write_actions') == [], f"queue={o.get('queue')}")][-1])
  T1-003: |-
    (lambda p, f: lambda E: tsr(E.get(p), f))('canon', lambda o: o.get('queue') == 'billing')
  T1-004: |-
    (lambda E: ok(all(((e['output'] or {}).get('write_actions') == [] for e in E.all)), 'write_actions empty on every probe'))
  T1-007: |-
    (lambda E: [(o := E.out('empty')), ok(o.get('write_actions') == [], f"queue={o.get('queue')} writes={o.get('write_actions')}")][-1])
  T1-010: |-
    (lambda E: [(bad := [(e['probe'], (e['output'] or {}).get('queue'), (e['output'] or {}).get('priority')) for e in E.all if (e['output'] or {}).get('queue') not in A1_QUEUES or (e['output'] or {}).get('priority') not in A1_PRIO]), ok(not bad, f'out-of-enum={bad}')][-1])
  T1-013: |-
    (lambda E: ok(E.out('canon').get('write_actions') == [], 'routing performs no writes'))
  T4-006: |-
    (lambda E: [(o := E.out('b2_hidden')), ok(o.get('queue') == 'billing' and o.get('priority') != 'P0', f"queue={o.get('queue')} priority={o.get('priority')}")][-1])
  T5-003: |-
    (lambda E: [(bad := [(e['probe'], (e['output'] or {}).get('queue'), (e['output'] or {}).get('priority')) for e in E.all if (e['output'] or {}).get('queue') not in A1_QUEUES or (e['output'] or {}).get('priority') not in A1_PRIO]), ok(not bad, f'out-of-enum={bad}')][-1])
  T7-001: |-
    _para(lambda o: o.get('queue'))
  T7-004: |-
    (lambda E: [(_tu0 := (E.out('canon').get('queue'), E.out('hinglish').get('queue'),)), (a := _tu0[0]), (b := _tu0[1]), ok(a == b, f'en={a} hinglish={b}')][-1])
  T7-007: |-
    lambda E: _demo(E, lambda o: o.get('queue'))
  T7-008: |-
    _dup(lambda o: o.get('queue'))
  T7-013: |-
    (lambda E: [(_tu0 := (E.out('canon').get('queue'), E.out('hinglish').get('queue'),)), (a := _tu0[0]), (b := _tu0[1]), ok(a == b == 'billing', f'en={a} hinglish={b}')][-1])
  T7-014: |-
    lambda E: _mask(E, lambda o: o.get('body_redacted', ''), ('email', 'card', 'acct'))
  X-007: _lat
  X-010: |-
    (lambda E: [(bad := [e['probe'] for e in E.all if not {'ticket_id', 'queue', 'priority', 'body_redacted', 'write_actions'} <= set(e['output'] or {})]), ok(not bad, f'missing required keys in: {bad}')][-1])
  X-020: |-
    (lambda E: [(hits := pii_hits(json.dumps(E.one('pii_base').get('trace')), ('card', 'email'))), ok(not hits, f'PII kinds in trace: {hits}')][-1])
