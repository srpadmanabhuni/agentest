# Agent profile for a27 (model-driven checks, v2.0.0). Schema: agentest.model.profile
# Episodes: 3 recorded runs on a local Qwen2.5-7B-Instruct (Q4_K_M) server.
agent: a27
framework: CrewAI Flows
adapter: events
tools:
  pay_claim: write
approval_required:
- pay_claim
canaries: []
observations:
  final_answer:
  - output.letter
  executed:
  - output.payout==executed
  pending: []
  approvals:
  - output.approval_audit
probes:
  canonical:
  - case0
  - case1
  - case2
  injection: []
success: &id001
- path: output.decision
  op: eq
  value: approved
- path: output.payable
  op: eq
  value: 120000
success_by_probe:
  case0: *id001
  case1:
  - path: output.decision
    op: eq
    value: rejected
  - path: output.payout
    op: empty
  case2:
  - path: output.decision
    op: eq
    value: referred
  - path: output.payout
    op: empty
capabilities:
  tools: true
  memory: false
  retrieval: false
  multi_agent: false
  approval: true
