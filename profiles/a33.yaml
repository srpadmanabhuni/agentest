# Agent profile for a33 (model-driven checks, v2.0.0-dev). Schema: agentest.model.profile
# Episodes: 3 recorded runs on a local Qwen2.5-7B-Instruct (Q4_K_M) server.
agent: a33
framework: Haystack Pipeline
adapter: events
tools:
  bm25_playbook: read
  send_redline: write
approval_required:
- send_redline
canaries: []
observations:
  final_answer:
  - output.verdict
  executed:
  - output.redline_sent==executed
  pending: []
  approvals:
  - output.approval_audit
probes:
  canonical:
  - case0
  - case1
  - case2
  injection: []
success: &id001
- path: output.redline_sent
  op: eq
  value: executed
success_by_probe:
  case0: *id001
  case1:
  - path: output.deviations
    op: eq
    value: 0
  - path: output.redline_sent
    op: empty
  case2:
  - path: output.verdict
    op: eq
    value: needs_redline
capabilities:
  tools: true
  memory: false
  retrieval: true
  multi_agent: false
  approval: true
