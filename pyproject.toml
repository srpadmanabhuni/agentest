[project]
name = "agentest"
version = "2.0.0.dev0"
description = "Deterministic, offline test checks for tool-using LLM agents (Agentic AI Test Checklist 110 + 20 extensions)"
keywords = ["llm", "agents", "testing", "ai-safety", "evaluation", "langgraph", "crewai", "autogen", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dr Srinivas Padmanabhuni" }]

dependencies = []

[project.urls]
Homepage = "https://github.com/srpadmanabhuni/agentest"
Issues = "https://github.com/srpadmanabhuni/agentest/issues"
Changelog = "https://github.com/srpadmanabhuni/agentest/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.8", "pyyaml>=6"]
model = ["pyyaml>=6"]  # agent profiles for `agentest model` (v2.0.0-dev)

[project.scripts]
agentest = "agentest.cli:main"
atc = "agentest.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Data used by `agentest list/real` when installed from a wheel (located by agentest.paths.root()).
[tool.setuptools.data-files]
"share/agentest/catalog" = ["catalog/*.csv", "catalog/*.jsonl", "catalog/VERSION", "catalog/*.yaml"]
"share/agentest/fixtures/real" = ["fixtures/real/*.json", "fixtures/real/*.md"]
"share/agentest/fixtures/real/episodes" = ["fixtures/real/episodes/*.jsonl"]
"share/agentest/reference_agents/a03_rag_faq/docs" = ["reference_agents/a03_rag_faq/docs/*.md"]
"share/agentest/examples/byo_agent" = ["examples/byo_agent/my_agent.py"]
"share/agentest/profiles" = ["profiles/*.yaml"]
"share/agentest/examples/model_driven" = ["examples/model_driven/*.yaml", "examples/model_driven/*.jsonl"]

[tool.setuptools.package-data]
"agentest.model" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 200
extend-exclude = ["reference_agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["UP042"]  # Outcome(str, Enum) kept for 3.11 JSON behaviour

[tool.ruff.lint.per-file-ignores]
# closures in the probe loop are invoked immediately inside the same iteration
"src/agentest/real/live.py" = ["B023", "B905"]
# one-line check definitions are deliberate in the real-check table
"src/agentest/real/checks.py" = ["E701", "E702", "E731"]
"src/agentest/real/checks2.py" = ["E701", "E702", "E731", "E402"]
"src/agentest/real/synth.py" = ["E701", "E702", "E731"]
"tests/real/test_checks.py" = ["E701", "E702"]
