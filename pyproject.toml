[project]
name = "agentest"
version = "3.1.0"
description = "Deterministic, offline test checks for tool-using LLM agents (Agentic AI Test Checklist 110 + 20 extensions)"
keywords = ["llm", "agents", "testing", "ai-safety", "evaluation", "langgraph", "crewai", "autogen", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dr Srinivas Padmanabhuni" }]

dependencies = ["pyyaml>=6"]  # scenario oracles (test-owned, not per agent)

[project.urls]
Homepage = "https://github.com/srpadmanabhuni/agentest"
Issues = "https://github.com/srpadmanabhuni/agentest/issues"
Changelog = "https://github.com/srpadmanabhuni/agentest/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.8", "pyyaml>=6", "jsonschema>=4"]  # test-only: validates our JSON outputs
model = []  # kept for compatibility; pyyaml is now a core dependency

[project.scripts]
agentest = "agentest.cli:main"
atc = "agentest.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Bundled data located by agentest.paths.root() after a wheel install (generated by scripts/gen_data_files.py).
[tool.setuptools.data-files]
"share/agentest/catalog" = ["catalog/*.csv", "catalog/*.jsonl", "catalog/VERSION", "catalog/*.yaml"]
"share/agentest/fixtures/standards" = ["fixtures/standards/*.json"]
"share/agentest/agents/a01" = ["agents/a01/agent-card.json", "agents/a01/tools.json"]
"share/agentest/agents/a01/traces" = ["agents/a01/traces/*"]
