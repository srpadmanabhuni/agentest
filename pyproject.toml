[tool.setuptools.package-data]
"agentest.standards" = ["*.yaml", "*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["UP042"]  # Outcome(str, Enum) kept for 3.11 JSON behaviour
