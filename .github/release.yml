# Categories for GitHub's automatically generated release notes.
# A pull request is listed under the first category that matches one of its labels.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - "status: duplicate"
      - "status: wontfix"
      - duplicate
      - invalid
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking
        - breaking-change
    - title: Bug fixes
      labels:
        - "type: bug"
        - bug
        - "type: false-positive"
        - "type: false-negative"
    - title: Detection
      labels:
        - detection
    - title: Features
      labels:
        - "type: feature"
        - enhancement
    - title: Adapters and importers
      labels:
        - adapter
        - "type: converter"
    - title: Documentation
      labels:
        - "type: docs"
        - docs
        - documentation
    - title: Other changes
      labels:
        - "*"
