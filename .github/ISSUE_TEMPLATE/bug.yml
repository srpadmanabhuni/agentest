name: Bug report
description: A crash, wrong output format, CLI error or install problem (for a wrong verdict use the false-positive / false-negative forms).
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, API keys, tokens or personal data (names, emails, phone numbers, account IDs).** Redact traces before attaching them. Security issues: email srinivas AT testAIng.com instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and steps to reproduce
      render: shell
      placeholder: agentest std run --otlp trace.otlp.json --card agent-card.json --tools tools.json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected, and the actual output or traceback.
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Minimal trace / input (redacted)
      description: Attach the smallest redacted trace, card or tools file that reproduces it, if relevant.
  - type: input
    id: version
    attributes:
      label: agentest version
      description: Output of `agentest version` (and the commit if installed from git).
      placeholder: "3.3.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, Ubuntu 24.04"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, API keys and personal data from everything I pasted or attached.
          required: true
