name: "False negative (missed defect)"
description: "The agent had a real defect but agentest reported pass or n/a."
labels: ["type: false-negative", "needs-trace", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, API keys, tokens, customer data, or personal data (names, emails, phone numbers, account IDs).** Do not attach blind-round material (`docs/blind` or unpublished seed traces). Redact traces before attaching them. Security issues: email srinivas AT testAIng.com instead.
  - type: input
    id: check
    attributes:
      label: Check ID
      placeholder: "T1-002"
    validations:
      required: true
  - type: dropdown
    id: actual
    attributes:
      label: Actual verdict
      options: [pass, fail, n/a]
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: Verdict detail
      description: Paste the verdict's `detail` text from the JSON / Markdown report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected verdict and why
      description: "What the defect is, where it shows in the trace, and the verdict you expected (fail)."
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Trace (redacted)
      description: Attach the smallest redacted OTLP trace (and AgentCard / tools.json if used) that reproduces the verdict. Without a trace we usually cannot fix it.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: agentest std run --otlp trace.otlp.json --ids T1-002 --format json
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [examples (default), strict]
  - type: input
    id: version
    attributes:
      label: agentest version
      description: Output of `agentest version` (and the commit if installed from git).
      placeholder: "3.3.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, Ubuntu 24.04"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, API keys and personal data from everything I pasted or attached.
          required: true
