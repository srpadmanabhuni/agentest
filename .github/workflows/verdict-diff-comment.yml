name: verdict-diff-comment

# Posts or updates ONE comment on the pull request with the verdicts the pull request changes. It runs from the
# default branch after "verdict-diff" finishes, with a write token, and it never checks out or runs pull-request code.
# The artifact is untrusted: it is size-limited, parsed as JSON, validated field by field, and only validated values are
# rendered. The pull request number comes from the API (the commit that was tested), never from the artifact.

on:
  workflow_run:
    workflows: ["verdict-diff"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verdict-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- agentest-verdict-diff -->';
            const MAX_BYTES = 200000, MAX_ROWS = 100;
            const run = context.payload.workflow_run;
            const file = 'artifact/diff.json';
            if (!fs.existsSync(file) || fs.statSync(file).size > MAX_BYTES) { core.setFailed('missing or oversized artifact'); return; }
            let data;
            try { data = JSON.parse(fs.readFileSync(file, 'utf8')); } catch (e) { core.setFailed('artifact is not JSON'); return; }
            const word = /^(pass|fail|n\/a)$/, mode = /^(strict|examples)$/;
            const agent = /^[A-Za-z0-9_.\/-]{1,80}$/, check = /^[A-Z][A-Z0-9]{0,2}-[0-9]{3}$/;
            const str = (v) => typeof v === 'string';
            if (!data || !Array.isArray(data.changed) || !Array.isArray(data.agents_added) || !Array.isArray(data.agents_removed)) { core.setFailed('unexpected artifact shape'); return; }
            const rows = [];
            for (const c of data.changed) {
              if (!c || !str(c.mode) || !str(c.agent) || !str(c.check) || !str(c.before) || !str(c.after)) { core.setFailed('bad row'); return; }
              if (!mode.test(c.mode) || !agent.test(c.agent) || !check.test(c.check) || !word.test(c.before) || !word.test(c.after)) { core.setFailed('row failed validation'); return; }
              rows.push(c);
            }
            const names = (a) => { const ok = a.filter((x) => str(x) && agent.test(x)); return ok.slice(0, 20); };
            const added = names(data.agents_added), removed = names(data.agents_removed);

            // the pull request: from the API, for the commit that was tested
            let pr = (run.pull_requests || []).find((p) => p.base.repo.id === run.repository.id);
            let prNumber = pr && pr.number;
            if (!prNumber) {
              const found = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, { owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha });
              const open = found.filter((p) => p.state === 'open' && p.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` && p.head.sha === run.head_sha);
              prNumber = open.length ? open[0].number : 0;
            }
            if (!prNumber) { core.info('no open pull request for this commit'); return; }

            const existing = (await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, per_page: 100 }))
              .find((c) => c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.startsWith(MARKER));
            const empty = !rows.length && !added.length && !removed.length;
            if (empty && !existing) { core.info('no verdict changes and no earlier comment'); return; }

            const lines = [MARKER, '### Verdict diff on the public example agents', ''];
            if (empty) {
              lines.push('No verdict differs from the base branch on the public example agents.');
            } else {
              lines.push(`${rows.length} verdict(s) differ from the base branch (pass / fail / n/a, both modes):`, '', '| mode | example agent | check | before | after |', '|---|---|---|---|---|');
              for (const c of rows.slice(0, MAX_ROWS)) lines.push(`| ${c.mode} | \`${c.agent}\` | \`${c.check}\` | ${c.before} | ${c.after} |`);
              if (rows.length > MAX_ROWS) lines.push('', `...and ${rows.length - MAX_ROWS} more (run \`make eval\` locally for the full list).`);
              if (added.length) lines.push('', 'Example agents added: ' + added.map((x) => `\`${x}\``).join(', '));
              if (removed.length) lines.push('', 'Example agents removed: ' + removed.map((x) => `\`${x}\``).join(', '));
              lines.push('', 'A changed verdict is not automatically wrong. Say in the pull request why the new verdict is right; a maintainer decides. If it is intended, regenerate the snapshot with `python scripts/verdict_snapshot.py --write` in the same pull request.');
            }
            lines.push('', `<sub>AiEnsured agentest, an Agentic AI Testing platform. Run \`make eval\` to see the same table locally. Tested commit ${run.head_sha.slice(0, 7)}.</sub>`);
            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body });
            }
