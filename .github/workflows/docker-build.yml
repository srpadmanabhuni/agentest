# Build the Dockerfile and run the default container (the README demo).
# Builds locally on the runner only: no login, no push, no image is published.
name: docker-build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (local only, not pushed)
        run: docker build -t agentest:ci .
      - name: Run the default container
        run: |
          docker run --rm --network none agentest:ci | tee out.md
          grep -E '^\| T1-018 \| fail \|' out.md
      - name: Run on a mounted trace
        run: |
          docker run --rm --network none -v "$PWD/examples/first_trace:/traces:ro" agentest:ci \
            std run --otlp /traces/trace.otlp.json --format md
