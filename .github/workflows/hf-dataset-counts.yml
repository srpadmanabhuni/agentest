name: hf-dataset-counts

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "scripts/check_hf_dataset_counts.py"
      - "scripts/hf_dataset_counts.json"
      - ".github/workflows/hf-dataset-counts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pinned Hugging Face checklist dataset counts
        run: python scripts/check_hf_dataset_counts.py
