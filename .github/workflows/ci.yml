name: ci

on:
  push:
    branches: [main, "v3.*", "v4.*", "r11-*"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # judge off: semantic checks must report not-assessed (never a regex fallback);
        # judge replay: the bundled judge cache (fixtures/judge/*.jsonl) answers offline, no model, no network
        judge: ["off", "replay"]
    env:
      AGENTEST_TEST_JUDGE: ${{ matrix.judge }}
      AGENTEST_JUDGE_OFFLINE: ${{ matrix.judge == 'replay' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Agent-vocabulary guard (blocking - no agent ids, names, tool names or agent model strings in src/, test logic, scripts or CI)
        run: python scripts/agent_vocab_guard.py
      - name: Catalogue pin check (offline)
        run: python scripts/check_catalog_pins.py
      - name: No regex-final checks (every pattern is a format validator or a pre-filter)
        run: python scripts/regex_final_count.py
      - name: Pytest (rules, guards, independence, no lock-in, OTel conformance, transport, doc commands)
        run: python -m pytest -q
      - name: Trust - forged traces pass no check (all IDs, every bundled agent); blind mode refuses unsigned traces
        run: |
          python -m pytest -q tests/test_trust_forgery.py
          set +e; agentest std run --blind --max-na 1 --agents examples/agnostic_demo/agents > blind.txt; rc=$?; set -e
          cat blind.txt; test "$rc" = 2 && grep -q "refused (unsigned trace)" blind.txt
          ! agentest verify-trace examples/agnostic_demo/agents/refill_bot/traces/refill_bot.otlp.jsonl
      - name: Coverage table is current
        run: python scripts/coverage_table.py --check
      - name: Standards-based checks - validate, 130 universal rules in both modes, regression floor
        run: |
          agentest std validate
          # the instrumentation-coverage gate is checked on its own in the next step; here it is off (--max-na 1)
          agentest std run --max-na 1 --json std-results.json --format md --out std-results.md
          agentest std run --max-na 1 --mode strict
          agentest std regress --json std-regress.json --floor 391
          cat std-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: v4.0 packs - kyc_bot passes all 14 pack checks (X-101..X-114), kyc_bot_buggy fails all 14
        run: |
          agentest std run --max-na 1 --agents examples/pack_defects/agents --json packs.json > /dev/null || true
          python -c "import json; d=json.load(open('packs.json')); ids=['X-%d' % n for n in range(101, 115)]; s={a: ''.join(d[a][i]['status'][0] for i in ids) for a in ('kyc_bot', 'kyc_bot_buggy')}; print(s); assert s == {'kyc_bot': 'p' * 14, 'kyc_bot_buggy': 'f' * 14}"
      - name: Instrumentation-coverage gate (default 90%) - replay flags exactly the thin reference traces a09, a10, a14, a19; judge off flags only a19
        run: |
          agentest std run > gate.txt 2>&1 || true
          grep '^instrumentation coverage FAIL' gate.txt | cut -d' ' -f4 | tr -d ':' | sort | paste -sd, - > gate-failing.txt || true
          cat gate-failing.txt
          # judge off: semantic checks are not-assessed (not n/a), so a14/a19 stay at 90% and pass the gate
          # r9: with 168 IDs the thinnest trace a19 crosses 90% n/a with the judge off too (139/154); a14 stays below
          # r11: four more IDs (X-051..X-054, n/a on traces without tool spans) take the thin a09/a10 traces to 146/162 n/a with replay
          test "$(cat gate-failing.txt)" = "${{ matrix.judge == 'replay' && 'a09,a10,a14,a19' || 'a19' }}"
      - name: Agnostic demo (plain-Python agent, standard files only; buggy build must be caught)
        run: |
          agentest std validate --agents examples/agnostic_demo/agents
          agentest std run --agents examples/agnostic_demo/agents --agent refill_bot --strict
          ! agentest std run --agents examples/agnostic_demo/agents --agent refill_bot_buggy --strict
          agentest std run --agents examples/langgraph_import/agents
      - name: Native-log import, OTLP serve and verdicts as OTel events
        run: |
          agentest std import examples/agnostic_demo/native/refill_bot.jsonl --map examples/agnostic_demo/import/map.json \
            --tools examples/agnostic_demo/agents/refill_bot/tools.json --service refill_bot --out /tmp/rb.otlp.jsonl
          diff /tmp/rb.otlp.jsonl examples/agnostic_demo/agents/refill_bot/traces/refill_bot.otlp.jsonl
          python examples/otel_plain/emit_trace.py > /tmp/t.otlp.json
          agentest std serve --out /tmp/inbox --port 4319 --max-requests 1 &
          sleep 1
          curl -sf -X POST -H 'Content-Type: application/json' --data-binary @/tmp/t.otlp.json http://127.0.0.1:4319/v1/traces
          wait
          agentest std run --otlp /tmp/inbox/*/traces/*.otlp.jsonl --card examples/otel_plain/agent-card.json --tools examples/otel_plain/tools.json --format sarif --out /tmp/a.sarif
          agentest std run --otlp /tmp/t.otlp.json --format junit --out /tmp/a.xml --emit-otlp /tmp/verdicts.otlp.json
          agentest std catalog --format csv --out /tmp/catalog.csv
      - name: Wheel install smoke (outside the checkout)
        run: |
          python -m pip install build && python -m build
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          cd /tmp && /tmp/w/bin/agentest version && /tmp/w/bin/agentest list --class T3 && /tmp/w/bin/agentest std validate \
            && /tmp/w/bin/agentest std run --max-na 1 --mode strict && /tmp/w/bin/agentest std catalog --format csv > /tmp/c.csv
      - name: Fresh-clone install
        run: |
          git clone --depth 1 "file://$GITHUB_WORKSPACE" /tmp/fresh && cd /tmp/fresh
          python -m venv /tmp/fc && /tmp/fc/bin/pip install -e ".[dev]" && /tmp/fc/bin/agentest version && /tmp/fc/bin/agentest std run --max-na 1 --mode strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-results-${{ matrix.python-version }}-judge-${{ matrix.judge }}
          path: std-*.*

  otel-sdk-conformance:
    # Optional extras only (the core job above stays pyyaml-only, where these tests skip): a real OpenTelemetry SDK
    # exports over OTLP/HTTP protobuf (plain and gzip) to `agentest std serve`, and the official protobuf decoder
    # (extra `otlp`) must agree with the stdlib codec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the conformance extra
        run: python -m pip install -e ".[dev,conformance]"
      - name: Real-SDK conformance, official vs stdlib decoder, transport
        run: python -m pytest -q -rs tests/test_otel_sdk_conformance.py tests/test_otlp_transport.py tests/test_otel_conformance.py
      - name: No conformance test was skipped
        run: "! python -m pytest -q -rs tests/test_otel_sdk_conformance.py | grep -i skipped"
      - name: Official protobuf backend end to end
        run: |
          python examples/otel_plain/emit_trace.py > /tmp/t.otlp.json
          AGENTEST_OTLP_PROTOBUF=official python -m pytest -q tests/test_otlp_transport.py
