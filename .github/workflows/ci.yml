name: ci

on:
  push:
    branches: [main, model-driven]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests scripts
      - name: Catalogue pin check (offline)
        run: python scripts/check_catalog_pins.py
      - name: Pytest (functional, privacy, explainability, bias, orchestration, samples)
        run: pytest -q
      - name: Golden suites
        run: |
          agentest run --suite functional --agent golden
          agentest run --suite privacy --agent golden
          agentest run --suite explainability --agent golden
          agentest run --suite bias_fairness --agent golden
          agentest run --suite orchestration --agent golden
      - name: Sample agent matrix
        run: |
          agentest samples
          agentest matrix
      - name: Real checks - 130 IDs x 40 agents (offline replay of recorded reference-agent episodes)
        run: |
          agentest real --md real-results.md --json real-results.json
          cat real-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Model-driven checks (v2.0.0-dev) - validate traces, generic matrix, parity vs v1, YAML-only example
        run: |
          agentest model validate
          agentest model run --md model-results.md --json model-results.json
          agentest model parity
          agentest model run --profiles examples/model_driven
      - name: Bring-your-own-agent example
        run: |
          python examples/byo_agent/my_agent.py /tmp/ok.jsonl && agentest check /tmp/ok.jsonl --strict
          python examples/byo_agent/my_agent.py /tmp/bug.jsonl --buggy && ! agentest check /tmp/bug.jsonl --strict
      - name: Wheel install smoke (outside the checkout)
        run: |
          python -m pip install build && python -m build
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          cd /tmp && /tmp/w/bin/agentest version && /tmp/w/bin/agentest real --ids T1-001 && /tmp/w/bin/agentest list --class T3
      - uses: actions/upload-artifact@v4
        with:
          name: real-results
          path: |
            real-results.*
            model-results.*
