name: ci

on:
  push:
    branches: [main, "v3.*"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Catalogue pin check (offline)
        run: python scripts/check_catalog_pins.py
      - name: Version stamps match RELEASE (offline)
        run: python scripts/check_versions.py
      - name: Pytest (rules, guards, independence, no lock-in, OTel conformance, transport, doc commands)
        run: python -m pytest -q
      - name: Cache the opt-in Hub catalogue (pinned revision, so it is fetched at most once per revision)
        if: matrix.python-version == '3.12'
        uses: actions/cache@v4
        with:
          path: ~/.cache/agentest/hub
          key: agentest-hub-${{ hashFiles('src/agentest/standards/hub.py', 'catalog/VERSION') }}
      - name: Opt-in Hub catalogue (sha256-checked against catalog/VERSION; falls back to the vendored copy)
        if: matrix.python-version == '3.12'
        run: |
          agentest list --hub-catalogue --json > /tmp/hub-list.json
          python -c "import json; n = len(json.load(open('/tmp/hub-list.json'))); assert n >= 110, n; print(n, 'tests')"
      - name: Coverage table is current
        run: python scripts/coverage_table.py --check
      - name: Framework and coverage map are current
        run: python scripts/gen_framework.py --check
      - name: Per-test framework mapping is in sync with the catalogue
        run: python scripts/gen_framework_mapping.py --check
      - name: Standards-based checks - validate, rules in both modes, regression floor
        run: |
          agentest std validate
          agentest std run --json std-results.json --format md --out std-results.md
          agentest std run --mode strict
          agentest std regress --json std-regress.json
          cat std-results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Agnostic demo (plain-Python agent, standard files only; buggy build must be caught)
        run: |
          agentest std validate --agents examples/agnostic_demo/agents
          agentest std run --agents examples/agnostic_demo/agents --agent refill_bot --strict
          ! agentest std run --agents examples/agnostic_demo/agents --agent refill_bot_buggy --strict
          agentest std run --agents examples/langgraph_import/agents
      - name: Native-log import, OTLP serve and verdicts as OTel events
        run: |
          agentest std import examples/agnostic_demo/native/refill_bot.jsonl --map examples/agnostic_demo/import/map.json \
            --tools examples/agnostic_demo/agents/refill_bot/tools.json --service refill_bot --out /tmp/rb.otlp.jsonl
          diff /tmp/rb.otlp.jsonl examples/agnostic_demo/agents/refill_bot/traces/refill_bot.otlp.jsonl
          python examples/otel_plain/emit_trace.py > /tmp/t.otlp.json
          agentest std serve --out /tmp/inbox --port 4319 --max-requests 1 &
          sleep 1
          curl -sf -X POST -H 'Content-Type: application/json' --data-binary @/tmp/t.otlp.json http://127.0.0.1:4319/v1/traces
          wait
          agentest std run --otlp /tmp/inbox/*/traces/*.otlp.jsonl --card examples/otel_plain/agent-card.json --tools examples/otel_plain/tools.json --format sarif --out /tmp/a.sarif
          agentest std run --otlp /tmp/t.otlp.json --format junit --out /tmp/a.xml --emit-otlp /tmp/verdicts.otlp.json
          agentest std catalog --format csv --out /tmp/catalog.csv
      - name: Wheel install smoke (outside the checkout)
        run: |
          python -m pip install build && python -m build
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          cd /tmp && /tmp/w/bin/agentest version && /tmp/w/bin/agentest list --class T3 && /tmp/w/bin/agentest std validate \
            && /tmp/w/bin/agentest std run --mode strict && /tmp/w/bin/agentest std catalog --format csv > /tmp/c.csv
      - name: Fresh-clone install
        run: |
          git clone --depth 1 "file://$GITHUB_WORKSPACE" /tmp/fresh && cd /tmp/fresh
          python -m venv /tmp/fc && /tmp/fc/bin/pip install -e ".[dev]" && /tmp/fc/bin/agentest version && /tmp/fc/bin/agentest std run --mode strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-results-${{ matrix.python-version }}
          path: std-*.*

  action-self-test:
    # The composite action (action.yml) and the pre-commit hooks (.pre-commit-hooks.yaml), run exactly as a user would.
    # Offline demo agents only; nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Action, OTLP files, good agent (must pass)
        id: good
        uses: ./
        with:
          otlp: examples/agnostic_demo/agents/refill_bot/traces/*.otlp.jsonl
          card: examples/agnostic_demo/agents/refill_bot/agent-card.json
          tools: examples/agnostic_demo/agents/refill_bot/tools.json
          report: /tmp/good.md
      - name: Action, agent folder, buggy agent (must fail)
        id: buggy
        continue-on-error: true
        uses: ./
        with:
          agents: examples/agnostic_demo/agents
          agent: refill_bot_buggy
          format: junit
          report: /tmp/buggy.xml
          python-version: ""
      - name: Action, report only (must pass with fails reported)
        id: report_only
        uses: ./
        with:
          agents: examples/agnostic_demo/agents
          agent: refill_bot_buggy
          fail-on-fail: "false"
          format: sarif
          report: /tmp/buggy.sarif
          python-version: ""
      - name: Check the action outcomes and outputs
        env:
          GOOD_EXIT: ${{ steps.good.outputs.exit-code }}
          GOOD_FAILED: ${{ steps.good.outputs.failed }}
          BUGGY_OUTCOME: ${{ steps.buggy.outcome }}
          BUGGY_EXIT: ${{ steps.buggy.outputs.exit-code }}
          BUGGY_FAILED: ${{ steps.buggy.outputs.failed }}
          RO_EXIT: ${{ steps.report_only.outputs.exit-code }}
          RO_FAILED: ${{ steps.report_only.outputs.failed }}
        run: |
          set -eux
          test "$GOOD_EXIT" = 0 && test "$GOOD_FAILED" = 0 && test -s /tmp/good.md
          test "$BUGGY_OUTCOME" = failure && test "$BUGGY_EXIT" = 1 && test "$BUGGY_FAILED" -gt 0 && test -s /tmp/buggy.xml
          test "$RO_EXIT" = 0 && test "$RO_FAILED" -gt 0 && test -s /tmp/buggy.sarif
      - name: pre-commit hooks from this commit (good passes, buggy fails)
        run: |
          set -eux
          python -m pip install -q pre-commit
          rev="$(git rev-parse HEAD)"
          mkdir /tmp/pc && cp -r examples/agnostic_demo/agents /tmp/pc/agents && cd /tmp/pc && git init -q && git add -A
          B=agents/refill_bot_buggy
          cat > .pre-commit-config.yaml <<YAML
          repos:
            - repo: $GITHUB_WORKSPACE
              rev: $rev
              hooks:
                - id: agentest-otlp
                  args: [--card, agents/refill_bot/agent-card.json, --tools, agents/refill_bot/tools.json, --otlp]
                - id: agentest-validate
                - id: agentest-agents
          YAML
          pre-commit run agentest-otlp --files agents/refill_bot/traces/refill_bot.otlp.jsonl
          if pre-commit run agentest-otlp --files $B/traces/refill_bot_buggy.otlp.jsonl; then exit 1; fi
          pre-commit run agentest-validate --all-files
          if pre-commit run agentest-agents --all-files; then exit 1; fi
          git rm -rqf $B
          pre-commit run agentest-agents --all-files

  otel-sdk-conformance:
    # Optional extras only (the core job above stays pyyaml-only, where these tests skip): a real OpenTelemetry SDK
    # exports over OTLP/HTTP protobuf (plain and gzip) to `agentest std serve`, and the official protobuf decoder
    # (extra `otlp`) must agree with the stdlib codec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the conformance extra
        run: python -m pip install -e ".[dev,conformance]"
      - name: Real-SDK conformance, official vs stdlib decoder, transport
        run: python -m pytest -q -rs tests/test_otel_sdk_conformance.py tests/test_otlp_transport.py tests/test_otel_conformance.py tests/test_emit_sdk.py
      - name: No conformance test was skipped
        run: "! python -m pytest -q -rs tests/test_otel_sdk_conformance.py tests/test_emit_sdk.py | grep -i skipped"
      - name: Official protobuf backend end to end
        run: |
          python examples/otel_plain/emit_trace.py > /tmp/t.otlp.json
          AGENTEST_OTLP_PROTOBUF=official python -m pytest -q tests/test_otlp_transport.py
