# Labels for issue triage. Apply manually or with a label-sync tool; nothing syncs automatically.
- name: "type: bug"
  color: "d73a4a"
  description: "Crash, wrong output or CLI/install problem"
- name: "type: feature"
  color: "a2eeef"
  description: "New check, input, output or option"
- name: "type: false-positive"
  color: "e99695"
  description: "Reported fail, agent behaved correctly"
- name: "type: false-negative"
  color: "f9d0c4"
  description: "Real defect reported as pass or n/a"
- name: "type: question"
  color: "d876e3"
  description: "Usage question; answer and point to FAQ"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation"
- name: "type: converter"
  color: "5319e7"
  description: "Trace import / native log dialect"
- name: "check: T1"
  color: "c5def5"
  description: "Task success rate / terminal state"
- name: "check: T2"
  color: "c5def5"
  description: "Dependency ordering"
- name: "check: T3"
  color: "c5def5"
  description: "Control handover / authorisation"
- name: "check: T4"
  color: "c5def5"
  description: "Prompt injection from untrusted documents"
- name: "check: T5"
  color: "c5def5"
  description: "Tool-call allowlists"
- name: "check: T6"
  color: "c5def5"
  description: "State drift across turns"
- name: "check: T7"
  color: "c5def5"
  description: "Metamorphic / consistency checks"
- name: "check: X"
  color: "c5def5"
  description: "Repo extensions X-001..X-020"
- name: "status: needs-triage"
  color: "fbca04"
  description: "New, not yet reviewed"
- name: "status: confirmed"
  color: "0e8a16"
  description: "Reproduced"
- name: "status: needs-info"
  color: "fef2c0"
  description: "Waiting for reporter"
- name: "status: in-progress"
  color: "1d76db"
  description: "Being worked on"
- name: "status: wontfix"
  color: "ffffff"
  description: "Out of scope or by design"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"
- name: "needs-trace"
  color: "fef2c0"
  description: "Needs a redacted trace to reproduce"
- name: "good first issue"
  color: "7057ff"
  description: "Small, well-scoped, good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Contributions welcome"
- name: "privacy: redact"
  color: "b60205"
  description: "Contains secrets/PII; maintainer must edit or hide"
- name: "agent-agnostic"
  color: "bfdadc"
  description: "Touches the no-agent-specific-code rule"
