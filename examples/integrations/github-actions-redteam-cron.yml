# Copy to .github/workflows/agentest-redteam.yml in YOUR repository.
# Guide: docs/guides/RED-TEAM-YOUR-AGENT-TRACES-IN-CI.md
#
# Judges recorded adversarial traces (prompt injection, data exfiltration) of your agent on a schedule and on demand.
# Offline: no model call, no API key. Commit the traces at redteam/traces/*.otlp.jsonl, and your agent's AgentCard and
# MCP tool list at redteam/agent-card.json and redteam/tools.json, before this job runs.
# A failing check fails the job (--strict); the SARIF report is uploaded either way.
name: agentest-redteam

on:
  schedule:
    - cron: "30 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install agentest-ai
      - name: Summary in the job log
        run: agentest std run --otlp redteam/traces/*.otlp.jsonl --card redteam/agent-card.json --tools redteam/tools.json --ids T4,T5-004,T5-005,T5-017,T6-011,X-019 --format md >> "$GITHUB_STEP_SUMMARY"
      - name: Judge adversarial traces
        run: agentest std run --otlp redteam/traces/*.otlp.jsonl --card redteam/agent-card.json --tools redteam/tools.json --ids T4,T5-004,T5-005,T5-017,T6-011,X-019 --strict --format sarif --out agentest-redteam.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentest-redteam.sarif
