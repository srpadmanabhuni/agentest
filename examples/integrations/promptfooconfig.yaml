# promptfoo config (external example; not an agentest dependency).
# 1) python promptfoo_tests_from_hf.py   2) npx promptfoo@latest eval
# The echo provider is free and offline; swap in your own agent/provider.
# llm-rubric asserts need a grader model; for an offline smoke run use: npx promptfoo eval --no-cache -c promptfooconfig.smoke.yaml
description: agentest checklist examples
prompts:
  - "Scenario: {{scenario}}\nInput: {{input}}\nWhat should a correct agent do?"
providers:
  - echo
tests: file://tests.json
